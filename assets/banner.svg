<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
    }
    .float-card {
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35));
    }
    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.6; transform: scale(1.02); }
      100% { opacity: 0.2; transform: scale(0.98); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .pulse-bg {
      animation: pulse 6s infinite ease-in-out;
      transform-origin: center;
    }
    .data-stream {
      stroke-dasharray: 8, 8;
      animation: flowLine 4s linear infinite;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="200" cy="90" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="pulse-bg"/>
  <circle cx="1020" cy="310" r="160" fill="#b92b27" opacity="0.14" filter="url(#glow)" class="pulse-bg"/>

  <!-- Subtle Dynamic Background Connecting Circuit Lines -->
  <g opacity="0.4">
    <path class="data-stream" d="M 120 350 L 320 350 L 380 300 L 750 300 L 820 360 L 1080 360" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path class="data-stream" d="M 80 120 L 260 120 L 320 180 L 860 180 L 920 110 L 1120 110" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dashoffset="100"/>
  </g>

  <!-- Animated Floating Pill Badges (Background/Accent Depth) -->
  <g class="float-card pill-1" transform="translate(100, 48)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#38ef7d"/>
    <text x="32" y="21" class="badge-text">🕷️ Web Crawlers</text>
  </g>

  <g class="float-card pill-2" transform="translate(520, 48)">
    <rect width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#00f2fe"/>
    <text x="32" y="21" class="badge-text">🤖 Autonomous Agents</text>
  </g>

  <g class="float-card pill-3" transform="translate(940, 48)">
    <rect width="150" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="5" fill="#f43f5e"/>
    <text x="32" y="21" class="badge-text">⚡ RAG Ingestion</text>
  </g>

  <!-- Main Hero Content (Clear Foreground, Never Obscured) -->
  <g transform="translate(80, 140)">
    <!-- Pill Tag -->
    <rect width="320" height="30" rx="15" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.95"/>
    <text x="14" y="20" class="badge-text" fill="#00f2fe">🚀 CURATED DIRECTORY &amp; ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">
      Awesome Web Scraping &amp; Chatbot Infrastructure
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="116" class="subtitle-text">
      Production-Ready Crawlers, Stealth Headless Browsers, LLM-Ready Markdown Extractors &amp;
    </text>
    <!-- Subtitle Line 2 -->
    <text x="0" y="142" class="subtitle-text">
      Scalable RAG Ingestion Pipelines Powering Next-Generation Autonomous AI Teammates.
    </text>
  </g>

  <!-- Bottom Interactive Card Highlights -->
  <g transform="translate(80, 330)">
    <!-- SaaS Infrastructure Spec -->
    <g class="float-card" transform="translate(0, 0)">
      <rect width="320" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="25" class="badge-text" fill="#38bdf8">🌐 Enterprise Web Data SaaS</text>
      <text x="18" y="44" class="subtitle-text" font-size="12px" fill="#64748b">Apify • Bright Data • Zyte • Diffbot • ScrapingBee</text>
    </g>

    <!-- Open Source Engines -->
    <g class="float-card" transform="translate(360, 0)">
      <rect width="330" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="25" class="badge-text" fill="#a855f7">🔥 Open-Source Crawlers &amp; SDKs</text>
      <text x="18" y="44" class="subtitle-text" font-size="12px" fill="#64748b">Firecrawl • Crawl4AI • Playwright • Scrapy • Scrapling</text>
    </g>

    <!-- Chatbot & Agent Core -->
    <g class="float-card" transform="translate(730, 0)">
      <rect width="310" height="54" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="25" class="badge-text" fill="#34d399">💬 AI Chatbot &amp; Agent Workspaces</text>
      <text x="18" y="44" class="subtitle-text" font-size="12px" fill="#64748b">Dify • Open WebUI • RAGFlow • Browser-Use • LibreChat</text>
    </g>
  </g>
</svg>
